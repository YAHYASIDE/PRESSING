name: Deploy to GitHub Pages

# Hosts the app as an installable PWA at the GitHub Pages URL.
# Every push to main republishes it; the in-app "تحديث" button then pulls
# the new version onto each phone.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp manifest.webmanifest _site/
          cp sw.js _site/
          cp -r assets _site/assets
          # SPA-style fallback so any deep link still loads the app shell.
          cp index.html _site/404.html
          # Skip Jekyll processing (keeps files starting with _ and .well-known).
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
